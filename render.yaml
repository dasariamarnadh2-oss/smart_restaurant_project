services:
  - type: web
    name: restaurant-ordering-demo
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn restaurant_project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: WEB_CONCURRENCY
        value: 2
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
